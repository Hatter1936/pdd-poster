name: PDD Daily Post

on:
  schedule:
    - cron: '0 7,15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if progress exists
        run: |
          if [ -f progress.json ]; then
            echo "✅ progress.json найден"
            cat progress.json
          else
            echo "ℹ️ progress.json не найден, создаем начальный"
            echo '{"current_ticket": 1, "current_question": 1}' > progress.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyrogram tgcrypto requests beautifulsoup4

      - name: Run script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python main.py