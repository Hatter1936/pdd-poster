name: PDD Daily Post

on:
  schedule:
    - cron: '0 3,11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore progress
        uses: actions/download-artifact@v4
        with:
          name: progress
          path: .
        continue-on-error: true

      - name: Ensure progress file exists
        run: |
          if [ ! -f progress.json ]; then
            echo '{"current_ticket": 1, "current_question": 1}' > progress.json
          fi
          cat progress.json

      - name: Install dependencies
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir telethon==1.28.5 requests beautifulsoup4 lxml

      - name: List environment variables (debug)
        run: |
          echo "API_ID is set: ${{ secrets.API_ID != '' }}"
          echo "API_HASH is set: ${{ secrets.API_HASH != '' }}"
          echo "CHANNEL_ID is set: ${{ secrets.CHANNEL_ID != '' }}"
          echo "SESSION_STRING is set: ${{ secrets.SESSION_STRING != '' }}"

      - name: Run script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python main.py

      - name: Save progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress
          path: progress.json
          retention-days: 30

      - name: Commit progress
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add progress.json || true
          git diff --staged --quiet || git commit -m "Update progress [skip ci]"
          git push || true
