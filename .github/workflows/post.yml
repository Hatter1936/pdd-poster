name: PDD Daily Post

on:
  schedule:
    - cron: '0 7,15 * * *'  # Запуск каждый день в 07:00 и 15:00 UTC
  workflow_dispatch:        # Возможность запускать кнопкой вручную

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Проверяем наличие файла прогресса
      - name: Check if progress exists
        run: |
          if [ -f progress.json ]; then
            echo "✅ progress.json найден"
            cat progress.json
          else
            echo '{"current_ticket": 1, "current_question": 1}' > progress.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Устанавливаем Telethon и BeautifulSoup для парсинга
      - name: Install dependencies
        run: |
          pip install telethon requests beautifulsoup4

      # Запускаем публикацию
      - name: Run script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python main.py
