name: PDD Daily Post

on:
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 👇 ОЧИЩАЕМ КЕШ ПЕРЕД УСТАНОВКОЙ
      - name: Clear pip cache
        run: |
          pip cache purge
          rm -rf ~/.cache/pip

      - name: Restore progress
        id: restore_progress
        uses: actions/download-artifact@v4
        with:
          name: progress
          path: .
        continue-on-error: true

      - name: Check if progress exists
        run: |
          if [ -f progress.json ]; then
            echo "✅ progress.json найден"
            cat progress.json
          else
            echo '{"current_ticket": 1, "current_question": 1}' > progress.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir telethon==1.28.5 requests beautifulsoup4 lxml

      - name: Run script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python main.py

      - name: Save progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress
          path: progress.json
