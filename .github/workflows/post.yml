name: PDD Daily Post

on:
  schedule:
    - cron: '0 5,13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous progress
        uses: actions/download-artifact@v4
        with:
          name: progress
          path: .
        continue-on-error: true  # Если артефакта нет - не ошибка

      - name: Check if progress exists
        run: |
          if [ -f progress.json ]; then
            echo "Прогресс загружен:"
            cat progress.json
          else
            echo '{"current_ticket": 1, "current_question": 1}' > progress.json
            echo "Создан новый прогресс"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip show telethon

      - name: Run script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python main.py

      - name: Upload progress
        if: always()  # Даже если была ошибка, сохраняем прогресс
        uses: actions/upload-artifact@v4
        with:
          name: progress
          path: progress.json
